<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Push Notifications App</title>
    <script type="text/javascript">
      // GitHub Pages serves this for any unknown path. Re-encode the path into
      // a query string and redirect to index.html so vue-router can restore it.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // "/push-notifications"

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
